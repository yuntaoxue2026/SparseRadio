[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparseradiomap"
version = "0.1.0"
description = "Reproducible per-image reconstruction of sparsely observed simulated radio maps"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "torch>=2.2", "Pillow>=10", "pandas>=2", "matplotlib>=3.8", "requests>=2.31", "beautifulsoup4>=4.12", "threadpoolctl>=3"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
